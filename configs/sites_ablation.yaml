# Horizon-only ablation sites on the repo DEM (no reference photos, so only Horizon RMSE):
# the hillside view plus seven Apollo-like flat-ground views found with tools/find_views.py.
sites:
  - name: hillside
    dem: ../DESPINA_technical_details/TIF-to-image/dem_data.tif
    upscale: 4
    camera: {row_frac: 0.55, col_frac: 0.5, heading_deg: 135, pitch_deg: 0, hfov_deg: 49, eye_height_m: 1.6}
    sun: {az: 120, el: 12}
    category: hilly
